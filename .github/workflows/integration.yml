# Hand-maintained: NOT generated by scitrera-repo-tools.
#
# The rest of this repo's Go CI (vet, unit tests, golangci-lint, govulncheck)
# is generated as test-go.yml from versions.yaml. These two jobs stay by hand
# because they are not expressible as generator config: integration-test needs
# three service containers with health checks, non-default host ports and a
# RabbitMQ Streams advertised-host workaround, and e2e needs its own build tag,
# package scope and timeout. Encoding that in versions.yaml would mean
# reimplementing GitHub's `services:` schema for one repo's benefit.

name: Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    continue-on-error: false
    services:
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: ghcr.io/scitrera/rabbitmq-stream:4-management
        ports:
          - 55552:5552
          - 55672:5672
        env:
          # Force RabbitMQ Streams to advertise an address the test client
          # (running on the runner host, not inside the docker network) can
          # actually reach. Without this, the broker hands clients its
          # Docker-generated container hostname (e.g. b58b5094e4dc) in the
          # Metadata response; the runner's resolver returns NXDOMAIN and
          # all producer/consumer connection attempts fail with
          # `lookup <hostname> on 127.0.0.53:53: server misbehaving`.
          #
          # RABBITMQ_STREAM_ADVERTISED_HOST / _PORT are NOT recognized env
          # vars — the stream-plugin's nested config keys
          # (`stream.advertised_host`, `stream.advertised_port`) don't have
          # env-var auto-mappings in the official RabbitMQ image. Setting
          # them does nothing, which is what caused the silent failure.
          #
          # RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS IS honored: the entrypoint
          # forwards it to the Erlang VM, which applies the values directly
          # to the rabbitmq_stream application before plugin start. This is
          # the GHA-compatible equivalent of the rabbitmq.conf snippet used
          # by server/scripts/run_proxy_load_test.sh and
          # server/deployments/docker-compose/nginx/rabbitmq.conf.
          RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '-rabbitmq_stream advertised_host "127.0.0.1" -rabbitmq_stream advertised_port 55552'
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether_test
          POSTGRES_DB: aether
        options: >-
          --health-cmd "pg_isready -U aether"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REDIS_ADDR: localhost:56379
      RABBITMQ_STREAM_URL: rabbitmq-stream://guest:guest@localhost:55552
      RABBITMQ_AMQP_URL: amqp://guest:guest@localhost:55672/
      POSTGRES_DSN: postgres://aether:aether_test@localhost:5432/aether?sslmode=disable

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: server/go.sum

      - name: Run integration tests
        working-directory: server
        # Serialize with -p 1 -parallel 1: these integration tests spin up
        # embedded NATS clusters and real sidecar runners/tunnels. Running them
        # concurrently on the 2-core runner starves timing-sensitive setup
        # (JetStream elections, tunnel handshakes) and causes contention flakes.
        run: go test -race -count=1 -p 1 -parallel 1 -tags=integration ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: server/go.sum

      # The e2e suite spawns aetherlite as a subprocess and exercises the
      # gateway / sidecar / SDK round-trip end to end. No external services
      # are needed — aetherlite ships its own embedded SQLite + Badger.
      # Scoped to the integration_e2e package; other dirs without build-tag
      # gating (e.g. internal/cluster/integration) require NATS/JetStream
      # and are covered by the integration-test job instead.
      - name: Run e2e tests
        working-directory: server
        env:
          AETHER_ALLOW_DEV_MODE: "true"
        # -parallel 1: the e2e tests share one aetherlite subprocess; running the
        # t.Parallel tunnel tests concurrently against the shared gateway causes
        # tunnel-lifecycle races (PEER_RESET) under 2-core-runner load. Serialize.
        run: go test -tags=e2e -count=1 -p 1 -parallel 1 -timeout 360s ./internal/proxysidecar/integration_e2e/...


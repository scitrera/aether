# Generated by scitrera-repo-tools `generate-ci-gha`. Do not edit by hand;
# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Proto Check

on:
  pull_request:
    paths:
      - 'api/proto/**'
      - 'sdk/python-client/scitrera_aether_client/proto/**'
      - 'sdk/typescript/src/proto/**'
      - 'versions.yaml'

concurrency:
  group: proto-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proto-check-go:
    name: compile-protos --check (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache: false

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '33.5'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go proto plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Verify generated Go code is up to date
        run: uvx --from 'scitrera-repo-tools==0.1.18' compile-protos --check --lang go

  proto-check-python:
    name: compile-protos --check (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install grpcio-tools
        run: pip install grpcio-tools==1.81.1

      - name: Verify generated Python code is up to date
        run: uvx --from 'scitrera-repo-tools==0.1.18' compile-protos --check --lang python --python "$(which python)"

  proto-check-typescript:
    name: compile-protos --check (typescript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install TypeScript proto tooling
        run: npm ci
        working-directory: sdk/typescript

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Verify generated TypeScript code is up to date
        run: uvx --from 'scitrera-repo-tools==0.1.18' compile-protos --check --lang typescript

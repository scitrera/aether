name: Publish (Go)

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-aether-api-go:
    name: Test aether-api-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: api/go.sum

      - name: go vet
        run: go vet ./...
        working-directory: api

      - name: go test
        run: go test -short -race -count=1 ./...
        working-directory: api

  test-aether-gateway:
    name: Test aether-gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: server/go.sum

      - name: go vet
        run: go vet ./...
        working-directory: server

      - name: go test
        run: go test -short -race -count=1 ./...
        working-directory: server

  test-aether-sdk-go:
    name: Test aether-sdk-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: sdk/go/go.sum

      - name: go vet
        run: go vet ./...
        working-directory: sdk/go

      - name: go test
        run: go test -short -race -count=1 ./...
        working-directory: sdk/go

  module-tags:
    name: Verify Go module tags
    runs-on: ubuntu-latest
    needs: [ test-aether-api-go, test-aether-gateway, test-aether-sdk-go ]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify per-module tags
        env:
          MODULE_DIRS: "api sdk/go server"
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          case "$VERSION" in v*) ;; *) echo "::error::expected a v-prefixed tag"; exit 1 ;; esac
          sha="$(git rev-list -n1 "$VERSION")"
          bad=0
          new=""
          for dir in $MODULE_DIRS; do
            tag="$dir/$VERSION"
            have="$(git rev-list -n1 "$tag" 2>/dev/null || true)"
            if [ -z "$have" ]; then
              echo "::error::missing tag $tag — Go cannot resolve this module at $VERSION"
              bad=1
            elif [ "$have" != "$sha" ]; then
              echo "::error::$tag points at $have but the release tag is $sha"
              bad=1
            else
              echo "$tag ok"
            fi
          done
          [ "$bad" = 0 ]

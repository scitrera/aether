name: Publish (Go)

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/test-go.yml

  module-tags:
    name: Publish Go module tags
    runs-on: ubuntu-latest
    needs: [ tests ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Reconcile per-module tags
        env:
          MODULE_DIRS: "api sdk/go server"
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          case "$VERSION" in v*) ;; *) echo "::error::expected a v-prefixed tag"; exit 1 ;; esac
          sha="$(git rev-list -n1 "$VERSION")"
          bad=0
          new=""
          for dir in $MODULE_DIRS; do
            tag="$dir/$VERSION"
            have="$(git rev-list -n1 "$tag" 2>/dev/null || true)"
            if [ -z "$have" ]; then
              echo "::notice::creating $tag at $sha"
              git tag "$tag" "$sha"
              new="$new $tag"
            elif [ "$have" != "$sha" ]; then
              echo "::error::$tag exists at $have but the release tag is $sha"
              bad=1
            else
              echo "$tag already correct"
            fi
          done
          if [ -n "$new" ]; then
            git push origin $new
          fi
          [ "$bad" = 0 ]

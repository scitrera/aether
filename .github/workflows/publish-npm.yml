# Generated by scitrera-repo-tools `generate-ci-gha`. Do not edit by hand;
# re-run the generator after editing versions.yaml. Run
# `generate-ci-gha` (no flags) to check for drift, `generate-ci-gha --force` to apply.

name: Publish (npm)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  tests:
    uses: ./.github/workflows/test-npm.yml

  publish-aether-sdk-typescript:
    name: Publish aether-sdk-typescript to npm
    runs-on: ubuntu-latest
    needs: [ tests ]
    environment:
      name: npm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Rewrite local refs to version pins
        run: uvx --from 'scitrera-repo-tools==0.1.18' sync-versions --release

      - name: Install dependencies
        run: npm ci
        working-directory: sdk/typescript

      - name: Build
        run: npm run build --if-present
        working-directory: sdk/typescript

      - name: Publish to npm
        run: npm publish --access public
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

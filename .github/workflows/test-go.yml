name: Test (Go)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

concurrency:
  group: test-go-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-aether-api-go:
    name: Test aether-api-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: api/go.sum

      - name: go vet
        run: go vet ./...
        working-directory: api

      - name: go test
        run: go test -short -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
        working-directory: api

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-aether-api-go
          path: api/coverage.out
          if-no-files-found: warn
          retention-days: 14
  lint-aether-api-go:
    name: Lint aether-api-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: api/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: 'v2.11.4'
          working-directory: api
          args: --timeout=5m
  security-aether-api-go:
    name: govulncheck aether-api-go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.12'
          cache-dependency-path: api/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
        working-directory: api

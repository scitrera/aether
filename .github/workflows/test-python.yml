name: Test (Python)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_call:

concurrency:
  # Keyed on the branch, not the ref: a push to a branch that already has an
  # open PR fires both `push` and `pull_request`, and github.ref differs between
  # them (refs/heads/X vs refs/pull/N/merge) so they would not otherwise
  # collapse. github.head_ref is set only for pull_request events, so both
  # resolve to the same branch name and the redundant run is cancelled.
  group: test-python-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-aether-sdk-python:
    name: Test aether-sdk-python (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"
        working-directory: sdk/python-client

      - name: Run tests
        run: python -m pytest -v
        working-directory: sdk/python-client

  test-aether-sdk-python-ag2:
    name: Test aether-sdk-python-ag2 (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"
        working-directory: sdk/python-ag2

      - name: Run tests
        run: python -m pytest -v
        working-directory: sdk/python-ag2

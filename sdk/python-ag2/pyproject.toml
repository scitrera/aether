[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitrera-aether-ag2"
version = "0.0.1"
description = "ag2 (AutoGen 2) adapter for the Scitrera Aether distributed control plane"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "scitrera.ai", email = "open-source-team@scitrera.com" }
]
keywords = [
    "aether",
    "scitrera",
    "ag2",
    "autogen",
    "agents",
    "distributed",
    "multi-agent",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "scitrera-aether-client>=0.2.0",
    "ag2>=0.10",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio>=0.23",
    "mypy>=1.8.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://aetherlayer.ai"
Documentation = "https://github.com/scitrera/aether#readme"
Repository = "https://github.com/scitrera/aether"
Issues = "https://github.com/scitrera/aether/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["scitrera_aether_ag2", "scitrera_aether_ag2*"]

[tool.setuptools.package-data]
scitrera_aether_ag2 = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitrera-aether-client"
version = "0.2.2"
description = "Python client SDK for Scitrera Aether distributed control plane"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "scitrera.ai", email = "open-source-team@scitrera.com" }
]
keywords = [
    "aether",
    "scitrera",
    "grpc",
    "distributed",
    "agents",
    "control-plane",
    "async",
    "asyncio"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "grpcio==1.81.1",
    "protobuf>=6.33.5",
]

[project.optional-dependencies]
dev = [
    "grpcio==1.81.1",
    "pytest==9.0.3",
    # Required, not optional: asyncio_mode = "auto" below plus ~170 async tests.
    "pytest-asyncio>=0.23.0",
    # requests and httpx are optional at runtime — requests_adapter.py and
    # httpx_transport.py both guard the import and raise a clear install hint —
    # but their test modules import them unconditionally, so the suite cannot run
    # without them. Absent from the extra, these passed locally only because a
    # shared virtualenv happened to have both installed.
    "requests>=2.32",
    "httpx>=0.27",
    "mypy>=1.8.0",
    "types-protobuf>=4.24.0",
    "grpc-stubs>=1.53.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://aetherlayer.ai"
Documentation = "https://github.com/scitrera/aether#readme"
Repository = "https://github.com/scitrera/aether"
Issues = "https://github.com/scitrera/aether/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["scitrera_aether_client", "scitrera_aether_client*"]

[tool.setuptools.package-data]
scitrera_aether_client = ["py.typed", "proto/*.pyi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true

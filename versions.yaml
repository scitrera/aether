# Authoritative versions for all Aether OSS packages.
# Run: python scripts/update-versions.py             to sync
# Run: python scripts/update-versions.py --check     to verify (CI-friendly)
#
# Go modules are released in lockstep: `aether-gateway` (server/), `aether-sdk-go` (sdk/go/),
# and the implicit `aether-api` (api/) module all share the same version tag. server/go.mod
# and sdk/go/go.mod both `require github.com/scitrera/aether/api` at the same version, and
# server/go.mod additionally requires `github.com/scitrera/aether/sdk/go`. The `replace`
# directives in each go.mod handle local builds; the `require` pins handle downstream
# `go get` from pkg.go.dev. The gomod_require rules below keep those pins in sync.

aether-gateway: 0.2.2

aether-sdk-go: 0.2.2         # github.com/scitrera/aether/sdk/go (also drives github.com/scitrera/aether/api require pins)

aether-sdk-typescript: 0.2.2  # @scitrera/aether-client

aether-sdk-python: 0.2.2      # scitrera-aether-client
aether-sdk-python-ag2: 0.0.2  # scitrera-aether-ag2

go_toolchain:
  go: "1.25.12"

# set explicit versions where possible to protect against supply chain attacks
preferred_versions:
  go:
    "google.golang.org/grpc": "1.81.1"
    "google.golang.org/protobuf": "1.36.11"
    "github.com/scitrera/go-backpressure": "v0.1.1"
  python:
    "grpcio": 1.81.1
    "grpcio-tools": 1.81.1
    # Floor is set by the generated Python gencode version (see the proto block):
    # protoc 33.5 emits gencode 6.33.5, and the runtime guard in *_pb2.py rejects
    # any protobuf runtime older than the gencode that produced it. Raise this in
    # lockstep whenever proto.toolchain.grpcio_tools moves.
    "protobuf": ">=6.33.5"
    "pytest": 9.0.3
  typescript:
    "@grpc/grpc-js": "1.14.3"
    "@grpc/proto-loader": "0.8.1"

# GitHub Actions generation. Run: generate-ci-gha [--check|--force]
#
# only_workflows is an allowlist: the generator owns proto-check.yml and nothing
# else. Every other workflow here is still hand-maintained — the generated
# test-{python,npm,go}.yml would duplicate what test.yml already covers, and
# version-check.yml plus the publish workflows would be rewritten. Add entries
# here as each one is adopted.
ci:
  # Pinned deliberately: a bare `scitrera-repo-tools` floats to the newest
  # release, which is the same unpinned-tooling drift proto-check exists to
  # catch. Bump in lockstep with the proto toolchain when repo-tools changes
  # generated output.
  repo_tools_source: "scitrera-repo-tools==0.1.13"
  only_workflows:
    - proto-check

# Protobuf/gRPC codegen. Run: compile-protos [--check]
#
# Every pin here is verified before any code is generated, because generated
# artifacts embed the versions of the tools that produced them — an unpinned
# compiler makes the proto drift check nondeterministic.
#
# protoc and grpcio-tools are two INDEPENDENT compilers (grpc_tools bundles its
# own libprotoc), so they are kept deliberately aligned: grpcio-tools 1.81.1
# bundles libprotoc 33.5, hence protoc 33.5 here. compile-protos cross-checks
# the pair and fails if they diverge.
proto:
  dir: api/proto
  files: [ aether.proto, sandbox_relay_tunnel.proto ]
  toolchain:
    protoc: "33.5"
    protoc_gen_go: null            # derived from preferred_versions.go["google.golang.org/protobuf"]
    protoc_gen_go_grpc: "v1.6.2"   # separate module; NOT derivable from google.golang.org/grpc
    grpcio_tools: "1.81.1"
    proto_loader: "0.8.1"
  outputs:
    go:
      path: api/proto
    python:
      path: sdk/python-client/scitrera_aether_client/proto
    typescript:
      path: sdk/typescript/src/proto
      package_dir: sdk/typescript

project_rules:
  aether-gateway:
    - { type: go_version,    path: server/internal/version/version.go }
    - { type: gomod_require, path: server/go.mod, args: [ github.com/scitrera/aether/api ] }
    - { type: gomod_require, path: server/go.mod, args: [ github.com/scitrera/aether/sdk/go ] }
  aether-api-go:
    - { type: gomod_require, path: api/go.mod }
  aether-sdk-go:
    - { type: go_version,    path: sdk/go/aether/version.go }
    - { type: gomod_require, path: sdk/go/go.mod, args: [ github.com/scitrera/aether/api ] }
  aether-sdk-python:
    - { type: pyproject, path: sdk/python-client/pyproject.toml }
    - { type: init_py,   path: sdk/python-client/scitrera_aether_client/__init__.py }
  aether-sdk-python-ag2:
    - { type: pyproject, path: sdk/python-ag2/pyproject.toml }
    - { type: init_py,   path: sdk/python-ag2/scitrera_aether_ag2/__init__.py }
  aether-sdk-typescript:
    - { type: package, path: sdk/typescript/package.json }
